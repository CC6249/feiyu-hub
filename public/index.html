<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>肥鱼控制中心</title>
<meta name="theme-color" content="#0a0d13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="肥鱼">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
:root{
  --bg:#0a0d13; --panel:#12161f; --panel-2:#161b26; --line:#1f2532;
  --text:#e6edf3; --muted:#8b949e; --dim:#5c6570;
  --green:#3fb950; --red:#f85149; --amber:#d29922;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5;
  padding:calc(var(--safe-t) + 18px) 16px calc(var(--safe-b) + 24px);
  max-width:760px; margin:0 auto;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.whale{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(145deg,#1f6feb,#0d419d);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(31,111,235,.28);
}
h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);display:flex;align-items:center;
  justify-content:center;cursor:pointer;flex:0 0 auto;transition:.15s;
}
.iconbtn:active{background:var(--panel-2);transform:scale(.94)}
.iconbtn.spin svg{animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}

.stats{
  display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap;
}
.chip{
  font-size:12px;padding:5px 11px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;
}
.chip b{color:var(--text);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 auto}
.dot.on{background:var(--green);box-shadow:0 0 7px rgba(63,185,80,.7)}

.group-title{
  font-size:12px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase;
  margin:22px 0 10px 4px;font-weight:600;
}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}

.card{
  position:relative;display:flex;align-items:center;gap:13px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:14px 14px 14px 16px;cursor:pointer;overflow:hidden;
  transition:transform .12s ease, background .12s ease, border-color .12s;
  text-decoration:none;color:inherit;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,#2f81f7);
}
.card:active{transform:scale(.98);background:var(--panel-2);border-color:#2a3242}
.card.off{opacity:.55}
.badge{
  width:44px;height:44px;border-radius:13px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--accent,#2f81f7) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--accent,#2f81f7) 30%, transparent);
}
.badge svg{width:22px;height:22px;stroke:var(--accent,#2f81f7);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keytag{
  display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:500;
  padding:1px 6px;margin-left:6px;border-radius:6px;vertical-align:1px;
  background:rgba(163,113,247,.14);color:#b392f0;border:1px solid rgba(163,113,247,.28);
}
.desc{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.ms{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.state{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(63,185,80,.12);color:var(--green);font-weight:500}
.state.bad{background:rgba(248,81,73,.12);color:var(--red)}
.rm{
  font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:8px;
  padding:3px 10px;cursor:pointer;white-space:nowrap;
}
.rm:active{color:var(--red);border-color:rgba(248,81,73,.45)}

/* 端口扫描 */
.btn{
  font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:9px 15px;cursor:pointer;transition:.15s;
}
.btn:active{transform:scale(.97);background:var(--panel-2)}
.btn.primary{background:linear-gradient(180deg,#1f6feb,#1a5fd0);border-color:#2f6fed;color:#fff}
.btn[disabled]{opacity:.5}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.scanbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.scanlist{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;
}
.row .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:44px}
.row .t{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .act{flex:0 0 auto}
.tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tag.ok{color:var(--green);border-color:rgba(63,185,80,.35);background:rgba(63,185,80,.08)}

footer{margin-top:30px;text-align:center;font-size:11.5px;color:var(--dim);line-height:1.9}
.hint{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:rgba(31,111,235,.06);font-size:12.5px;color:var(--muted);line-height:1.65}
.hint b{color:var(--text)}
.hint code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:#b392f0}
.toast{
  position:fixed;left:50%;bottom:calc(var(--safe-b) + 28px);transform:translate(-50%,20px);
  background:#1c2333;border:1px solid #2c3546;color:var(--text);
  padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;
  transition:.25s;pointer-events:none;z-index:50;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.skeleton{height:74px;border-radius:16px;background:var(--panel);border:1px solid var(--line);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}
</style>
</head>
<body>

<header>
  <div class="whale">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 13c2.5 0 3.2-2 4.6-2 1.5 0 1.9 2 3.4 2s1.9-2 3.4-2c1.4 0 2.1 2 4.6 2"/>
      <path d="M6.5 16.5c2 2.2 4.6 3 6.5 3 4.4 0 8-3.4 8-8"/>
      <circle cx="17.5" cy="8.5" r=".6" fill="#fff" stroke="none"/>
      <path d="M20.5 8.5c0-1.4.8-2.4 2-2.9"/>
    </svg>
  </div>
  <div>
    <h1 id="siteName">肥鱼控制中心</h1>
    <div class="sub" id="sub">正在连接…</div>
  </div>
  <div class="spacer"></div>
  <div class="iconbtn" id="refreshBtn" onclick="refresh(true)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
    </svg>
  </div>
</header>

<div class="stats">
  <span class="chip"><span class="dot" id="dotAll"></span><span id="onlineChip">—</span></span>
  <span class="chip" id="hostChip">—</span>
</div>

<div id="list">
  <div class="grid" style="margin-top:18px">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<div class="hint" id="hint" style="display:none">
  <b>提示</b><span id="hintText"></span>
</div>

<div class="group-title">端口扫描</div>
<div class="scanbar">
  <button class="btn primary" id="scanBtn" onclick="scan()">扫描本机端口</button>
  <span class="chip" id="scanState">未扫描</span>
</div>
<div class="scanlist" id="scanList"></div>

<footer>
  <div id="foot">feiyu hub</div>
</footer>

<div class="toast" id="toast"></div>

<script>
const ICONS = {
  snowluma:'<path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1"/>',
  ha:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5.5h5V20"/>',
  novnc:'<rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/>',
  fnos:'<rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/>',
  invr:'<path d="M3 8.5 12 4l9 4.5v7L12 20l-9-4.5z"/><circle cx="12" cy="12" r="2.8"/>',
  bridge:'<circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="6" r="2.6"/><circle cx="12" cy="18" r="2.6"/><path d="M8.2 7.4 10.9 16M15.8 7.4 13.1 16M8.6 6h6.8"/>',
  dsh:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/>',
  _default:'<rect x="3" y="3.5" width="18" height="17" rx="3"/><path d="M3 9h18M8 13.5h8M8 17h5"/>'
};
const ACCENT = {
  blue:'#2f81f7', amber:'#d29922', violet:'#a371f7',
  green:'#3fb950', cyan:'#39c5cf', pink:'#db61a2'
};
let timer = null;
let busy = false;

function el(id){ return document.getElementById(id); }

function toast(msg){
  const t = el('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function card(s){
  const a = ACCENT[s.accent] || ACCENT.blue;
  const on = s.alive;
  const href = s.url || '#';
  const hasSecret = !!(s.autocopy && s.secret);
  const secretAttr = hasSecret
    ? ` data-secret="${esc(s.secret)}" data-secret-label="${esc(s.secretLabel||'密钥')}"`
    : '';
  const rm = s.custom ? `<span class="rm" data-port="${s.port}" role="button">移除</span>` : '';
  return `<a class="card ${on?'':'off'}" href="${href}" target="${s.openInNewTab===false?'_self':'_blank'}" rel="noopener" style="--accent:${a}"${secretAttr}>
    <div class="badge"><svg viewBox="0 0 24 24">${ICONS[s.icon]||ICONS[s.id]||ICONS._default}</svg></div>
    <div class="body">
      <div class="name">${esc(s.name)}${hasSecret?'<span class="keytag">🔑 自动复制</span>':''}</div>
      <div class="desc">${esc(s.desc||'')}</div>
    </div>
    <div class="right">
      <span class="state ${on?'':'bad'}">${on?'在线':'离线'}</span>
      <span class="ms">${on?(s.ms?s.ms+'ms':''):(s.err==='timeout'?'超时':'—')}</span>
      ${rm}
    </div>
  </a>`;
}

/* 同步复制：http 页面（局域网 IP / Tailscale IP）不是安全上下文，
   navigator.clipboard 不可用，必须用 execCommand */
function legacyCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly','');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;';
  document.body.appendChild(ta);
  let ok = false;
  try {
    ta.select();
    ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
  } catch(e){ ok = false; }
  ta.remove();
  return ok;
}

/* 点开需要密钥的服务（如 noVNC）：先在用户手势内同步写入剪贴板，
   再让 <a target="_blank"> 照常打开，新页面里长按 / Ctrl+V 即可 */
el('list').addEventListener('click', (e)=>{
  const rm = e.target.closest('.rm');
  if(rm){ e.preventDefault(); e.stopPropagation(); unpin(Number(rm.dataset.port)); return; }
  const a = e.target.closest('a.card');
  if(!a || !a.dataset.secret) return;
  const label = a.dataset.secretLabel || '密钥';
  if(legacyCopy(a.dataset.secret)) toast(label + ' 已复制，直接粘贴即可');
});

function render(data){
  const svcs = data.services || [];
  const site = data.site || {};
  if (site.name){
    document.title = site.name;
    el('siteName').textContent = site.name;
    const at = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if (at) at.setAttribute('content', site.shortName || site.name);
  }
  if (site.footer) el('foot').textContent = site.footer;

  if (!svcs.length){
    el('list').innerHTML = '<div class="hint" style="display:block;margin-top:18px">'
      + '<b>还没有配置服务</b>　编辑 <code>config.json</code> 里的 <code>services</code> 数组，保存后点右上角刷新（或访问 <code>/api/reload</code>）。'
      + '</div>';
    el('onlineChip').textContent = '0 / 0 在线';
    el('dotAll').className = 'dot';
    el('hostChip').textContent = data.host || '';
    el('sub').textContent = site.subtitle || '未配置服务';
    el('hint').style.display = 'none';
    return;
  }

  const groups = [];
  for (const s of svcs){
    let g = groups.find(x=>x.name===s.group);
    if(!g){ g={name:s.group,items:[]}; groups.push(g); }
    g.items.push(s);
  }
  el('list').innerHTML = groups.map(g=>
    `<div class="group-title">${g.name}</div><div class="grid">${g.items.map(card).join('')}</div>`
  ).join('');

  const up = svcs.filter(s=>s.alive).length;
  el('onlineChip').innerHTML = `<b>${up}/${svcs.length}</b> 在线`;
  el('dotAll').className = 'dot ' + (up===svcs.length?'on':(up?'':''));
  if(up && up<svcs.length) el('dotAll').style.background='var(--amber)';
  el('hostChip').textContent = data.host || '';
  el('sub').textContent = (data.host||'') + ' · ' + svcs.length + ' 个服务';

  const down = svcs.filter(s=>!s.alive);
  const hint = el('hint');
  if(down.length){
    el('hintText').innerHTML = ' · ' + down.map(s=>s.name).join('、') + ' 暂时连不上，下拉可重试';
    hint.style.display='block';
  } else hint.style.display='none';
}

async function refresh(manual){
  if(busy) return; busy = true;
  const btn = el('refreshBtn');
  if(manual) btn.classList.add('spin');
  try{
    const r = await fetch('/api/services', {cache:'no-store'});
    const data = await r.json();
    render(data);
    if(manual) toast('已刷新');
  }catch(e){
    toast('连接失败');
    el('sub').textContent = '无法连接 Hub';
  }finally{
    busy = false;
    if(manual) setTimeout(()=>btn.classList.remove('spin'), 500);
  }
}

/* ---------------------- 端口扫描 → 加入面板 ---------------------- */

async function post(url, body){
  const r = await fetch(url, {
    method:'POST', cache:'no-store',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body || {})
  });
  return r.json();
}

async function scan(){
  const btn = el('scanBtn'), st = el('scanState'), list = el('scanList');
  btn.disabled = true; st.textContent = '扫描中…';
  list.innerHTML = '<div class="row"><div class="t">正在枚举本机监听端口并探测 HTTP 后台…</div></div>';
  try{
    const r = await fetch('/api/scan', {cache:'no-store'});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || '扫描失败');
    st.textContent = '扫描 ' + d.ports + ' 个端口 · 发现 ' + d.found + ' 个 HTTP 后台';
    renderScan(d.items || []);
  }catch(e){
    st.textContent = '扫描失败';
    list.innerHTML = '<div class="row"><div class="t">' + esc(e.message) + '</div></div>';
  }finally{ btn.disabled = false; }
}

function renderScan(items){
  const list = el('scanList');
  list._items = items;
  if(!items.length){
    list.innerHTML = '<div class="row"><div class="t">没有发现新的 HTTP 后台</div></div>';
    return;
  }
  list.innerHTML = items.map(x=>{
    let act;
    if(x.state === 'builtin') act = '<span class="tag">已在面板</span>';
    else if(x.state === 'pinned') act = '<span class="tag ok">已加入</span>';
    else act = '<button class="btn sm" onclick="pin(' + x.port + ')">加入面板</button>';
    return '<div class="row"><div class="p">' + x.port + '</div>' +
      '<div class="t" title="' + esc(x.title) + '">' + esc(x.title) + '</div>' +
      '<div class="act">' + act + '</div></div>';
  }).join('');
}

async function pin(port){
  const items = el('scanList')._items || [];
  const hit = items.find(x=>x.port===port);
  try{
    const d = await post('/api/services/add', {port, name: hit ? hit.title : ''});
    if(!d.ok) throw new Error(d.error || '失败');
    toast('端口 ' + port + ' 已加入面板');
    if(hit) hit.state = 'pinned';
    renderScan(items);
    await refresh(false);
  }catch(e){ toast('加入失败：' + e.message); }
}

async function unpin(port){
  if(!confirm('把端口 ' + port + ' 从面板移除？会同时改 config.json。')) return;
  try{
    const d = await post('/api/services/remove', {port});
    if(!d.ok) throw new Error(d.error || '失败');
    toast('已从面板移除');
    await refresh(false);
    const items = el('scanList')._items;
    if(items){
      const hit = items.find(x=>x.port===port);
      if(hit) hit.state = 'new';
      renderScan(items);
    }
  }catch(e){ toast('移除失败：' + e.message); }
}

// pull to refresh
let sy=0, pulling=false;
document.addEventListener('touchstart',e=>{
  if(window.scrollY<=0){ sy=e.touches[0].clientY; pulling=true; }
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!pulling) return;
  const dy=e.touches[0].clientY-sy;
  if(dy>70){ pulling=false; refresh(true); }
},{passive:true});
document.addEventListener('touchend',()=>{pulling=false});

refresh(false);
timer = setInterval(()=>refresh(false), 15000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') refresh(false);
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
